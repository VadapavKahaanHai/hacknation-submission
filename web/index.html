<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leaf Check">
<title>Leaf Check</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #F5F3EC; --card: #FFFFFF; --ink: #1B2A1F; --muted: #5C6B60; --line: #DDD8CC;
    --green: #1F6B3A; --green-soft: #E3F0E6; --amber-soft: #FFF4D6; --amber-ink: #6B4E00;
    --red-soft: #FDE7E4; --blue-soft: #E5EEF8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
  header h1 { font-size: 22px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 img { width: 30px; height: 30px; border-radius: 8px; }
  .lang { display: flex; border: 2px solid var(--green); border-radius: 999px; overflow: hidden; }
  .lang button { border: 0; background: transparent; color: var(--green); font: inherit; font-size: 16px; padding: 6px 14px; min-height: 40px; }
  .lang button.on { background: var(--green); color: #fff; }
  .screen { display: none; } .screen.on { display: block; }
  h2 { font-size: 24px; margin: 18px 0 12px; }
  .muted { color: var(--muted); }
  .crops { display: grid; gap: 12px; }
  .crop { display: flex; align-items: center; gap: 16px; width: 100%; padding: 18px; border: 2px solid var(--line);
    background: var(--card); border-radius: 18px; font: inherit; font-size: 22px; font-weight: 600; color: var(--ink); text-align: left; min-height: 84px; }
  .crop:active { border-color: var(--green); background: var(--green-soft); }
  .crop .emoji { font-size: 40px; width: 52px; text-align: center; }
  .big { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 64px; padding: 14px 18px;
    border-radius: 16px; border: 0; font: inherit; font-size: 20px; font-weight: 700; background: var(--green); color: #fff; cursor: pointer; }
  .big.secondary { background: var(--card); color: var(--green); border: 2px solid var(--green); }
  .big + .big, .stack > * + * { margin-top: 12px; }
  label.big input { display: none; }
  .tip { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 16px; padding: 14px; margin: 14px 0; border: 1px solid var(--line); }
  .tip .emoji { font-size: 34px; }
  .photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: 16px; display: block; margin: 8px 0 14px; background: #ddd; }
  .spinner { width: 54px; height: 54px; border: 6px solid var(--green-soft); border-top-color: var(--green); border-radius: 50%;
    animation: spin 0.9s linear infinite; margin: 24px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center { text-align: center; }
  .card { background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--line); margin-bottom: 12px; }
  .diag-name { font-size: 26px; font-weight: 800; margin: 2px 0 4px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; border-radius: 999px; padding: 6px 14px; font-size: 17px; }
  .conf { margin-top: 10px; font-size: 16px; color: var(--muted); }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--green); }
  .today { background: var(--green-soft); border: 2px solid var(--green); }
  .today h3, .card h3 { margin: 0 0 8px; font-size: 19px; }
  .today p { margin: 0; font-size: 20px; font-weight: 600; }
  ul { margin: 0; padding-left: 22px; } li + li { margin-top: 8px; }
  .safety { background: var(--amber-soft); color: var(--amber-ink); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 16px; }
  .expert { background: var(--blue-soft); }
  .possible { background: var(--amber-soft); color: var(--amber-ink); }
  .disclaimer { font-size: 14px; color: var(--muted); margin: 14px 4px; }
  .q { font-size: 21px; font-weight: 600; margin: 0 0 12px; }
  .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .yn button { min-height: 60px; border-radius: 14px; border: 2px solid var(--green); background: var(--card); color: var(--green); font: inherit; font-size: 20px; font-weight: 700; }
  .yn button.on { background: var(--green); color: #fff; }
  .skip { background: none; border: 0; color: var(--muted); font: inherit; font-size: 16px; text-decoration: underline; margin-top: 8px; min-height: 40px; }
  .status { font-size: 14px; color: var(--muted); text-align: center; margin-top: 18px; }
  .err { background: var(--red-soft); }
</style>
</head>
<body>
<header>
  <h1><img src="icon-192.png" alt=""> <span data-t="app">Leaf Check</span></h1>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en" class="on">EN</button><button data-lang="hi">हिंदी</button>
  </div>
</header>

<section id="s-loading" class="screen on center">
  <div class="spinner"></div>
  <p data-t="loading">Getting ready…</p>
</section>

<section id="s-error" class="screen"><div class="card err"><p id="err-text"></p></div></section>

<section id="s-crop" class="screen">
  <h2 data-t="pick">Which crop is it?</h2>
  <div class="crops" id="crop-list"></div>
</section>

<section id="s-camera" class="screen">
  <h2 id="camera-title"></h2>
  <div class="tip"><span class="emoji">🍃</span><span data-t="tip">One leaf, close up, in daylight. Fill the photo with the leaf.</span></div>
  <div class="stack">
    <label class="big"><span>📷</span><span data-t="take">Take photo of one leaf</span>
      <input type="file" accept="image/*" capture="environment" id="in-camera"></label>
    <label class="big secondary"><span>🖼️</span><span data-t="gallery">Choose from gallery</span>
      <input type="file" accept="image/*" id="in-gallery"></label>
    <button class="big secondary" data-go="crop">↩ <span data-t="change">Change crop</span></button>
  </div>
</section>

<section id="s-checking" class="screen center">
  <img class="photo" id="checking-photo" alt="">
  <div class="spinner"></div>
  <p data-t="checking">Checking the leaf…</p>
</section>

<section id="s-questions" class="screen">
  <img class="photo" id="q-photo" alt="">
  <div class="card possible"><p id="q-message" style="margin:0"></p></div>
  <div id="q-list"></div>
  <button class="big" id="q-done" data-t="see">See result</button>
</section>

<section id="s-result" class="screen">
  <img class="photo" id="r-photo" alt="">
  <div id="r-body"></div>
  <div class="stack">
    <button class="big" id="speak">🔊 <span data-t="read">Read aloud</span></button>
    <button class="big secondary" data-go="camera">📷 <span data-t="again">New photo</span></button>
    <button class="big secondary" data-go="crop">↩ <span data-t="change">Change crop</span></button>
  </div>
  <p class="disclaimer" id="r-disclaimer"></p>
</section>

<p class="status" id="status"></p>

<script src="vendor/tf.min.js"></script>
<script src="vendor/tf-backend-wasm.min.js"></script>
<script src="infer.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
